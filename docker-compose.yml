version: '3.8'

services:
  # PostgreSQL Database (shared with main migration)
  # Using external database container that's already running
  # postgres:
  #   image: postgres:15
  #   container_name: aci-database
  #   environment:
  #     POSTGRES_DB: pcb_inventory
  #     POSTGRES_USER: stockpick_user
  #     POSTGRES_PASSWORD: stockpick_pass
  #     PGDATA: /var/lib/postgresql/data/pgdata
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ../init:/docker-entrypoint-initdb.d
  #   ports:
  #     - "5001:5432"
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U stockpick_user -d pcb_inventory"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - stockpick-network

  # Flask Web Application
  web_app:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: stockandpick_webapp
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - POSTGRES_HOST=aci-database
      - POSTGRES_DB=kosh
      - POSTGRES_USER=aci
      - POSTGRES_PASSWORD=Pr1xtjxb3jUo
      - DATABASE_URL=postgresql://aci:Pr1xtjxb3jUo@aci-database:5432/kosh
      - FLASK_RUN_PORT=5000
      - SSO_SECRET_KEY=D4T_WY71xsF0_UB4QjIzlAjVlj-M5kEG0jsIws6isvPn5NNK4s5-_E_--WI6C6YT6jkerJ3EHncBEuG3tK5Rlg
      # Pinned Flask SECRET_KEY (defensive, bug SO-1): a stable secret keeps session
      # cookies valid across restarts/workers so kitting never bounces to SSO. Value
      # matches the in-code fallback so existing sessions stay signed-in.
      - SECRET_KEY=kosh-pcb-inventory-secret-key-2025-production-v1
    expose:
      - "5000"
    # Using external database, no dependency needed
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    restart: always
    volumes:
      - ./logs:/app/logs
      - static_files:/app/static
    networks:
      - stockpick-network
      - db-consolidation_aci-network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: stockandpick_nginx
    ports:
      - "5002:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/app/static:ro
    depends_on:
      - web_app
    restart: always
    networks:
      - stockpick-network

volumes:
  postgres_data:
  static_files:

networks:
  stockpick-network:
    driver: bridge
  db-consolidation_aci-network:
    external: true